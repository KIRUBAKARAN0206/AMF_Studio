<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMF Studio | Admin Panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap">
    <style>
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), url('/assets/home-bg-BiN7kxJK.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        .admin-container {
            width: 95%;
            max-width: 1400px;
            margin: 120px auto 50px;
            padding: 40px;
            background: rgba(10, 8, 19, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 0, 127, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(255, 0, 127, 0.05);
        }
        .admin-login {
            max-width: 420px;
            margin: 150px auto;
            padding: 40px;
            background: rgba(10, 8, 19, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 16px;
            border: 1px solid rgba(255, 0, 127, 0.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .admin-login .form-input {
            background-color: rgba(0, 0, 0, 0.5) !important;
            color: #fff !important;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2) !important;
        }
        .admin-login .form-input:focus {
            border-color: var(--accent-primary) !important;
        }
        .hidden { display: none !important; }
        .bookings-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            margin-top: 20px;
            color: #fff;
        }
        .bookings-table th, .bookings-table td {
            padding: 16px 20px;
            text-align: left;
            background: rgba(25, 20, 35, 0.8);
        }
        .bookings-table th { 
            background: transparent;
            color: var(--accent-primary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            border: none;
            padding-bottom: 5px;
        }
        .bookings-table td {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .bookings-table td:first-child {
            border-left: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px 0 0 12px;
        }
        .bookings-table td:last-child {
            border-right: 1px solid rgba(255,255,255,0.05);
            border-radius: 0 12px 12px 0;
        }
        .bookings-table tr {
            transition: all 0.3s ease;
        }
        .bookings-table tr:hover td { 
            background: rgba(255, 0, 127, 0.08);
            transform: scale(1.005);
        }
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
            height: 20px;
            width: 100%;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
    <meta name="google-site-verification" content="nENDPFyJ0hH978x9MThDZfYaYanw3JB3Xbrb7FQ0G4s" />
  <link rel="stylesheet" crossorigin href="/assets/style-DLxUEcRB.css">
</head>
<body class="home-layout">
    <!-- Header Navigation -->
    <header class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo" style="display: flex; align-items: center; gap: 10px;">
                <img src="/assets/logo-DbvTy0tq.webp" alt="AMF Studio Logo" style="height: 50px; width: auto; filter: drop-shadow(0 0 8px rgba(255, 0, 127, 0.45));">
                AMF <span>ADMIN</span>
            </a>
            <a href="index.html" class="nav-btn" style="background: transparent; border: 1px solid var(--accent-primary);">Back to Site</a>
        </div>
    </header>

    <div id="loginSection" class="admin-login contact-form-wrapper">
        <h2 style="color: #fff; margin-bottom: 25px; text-align: center;">Admin Portal</h2>
        <form id="adminLoginForm" class="contact-form" autocomplete="off">
            <div class="form-group">
                <input type="text" id="adminUsername" class="form-input" placeholder=" " required>
                <label for="adminUsername" class="form-label">Username</label>
            </div>
            <div class="form-group" style="margin-top: 25px;">
                <input type="password" id="adminPassword" class="form-input" placeholder=" " required>
                <label for="adminPassword" class="form-label">Password</label>
            </div>
            <p id="loginError" style="color: #ff4d4d; margin-top: 15px; display: none; text-align: center;">Invalid username or password</p>
            <button type="submit" class="btn-primary submit-btn" style="width: 100%; margin-top: 25px;">Login securely</button>
        </form>
    </div>

    <div id="dashboardSection" class="admin-container hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <h2 style="font-size: 2.2rem; margin: 0; background: linear-gradient(135deg, #FFF 0%, var(--accent-primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 30px rgba(212, 175, 55, 0.3); display: flex; align-items: center; gap: 12px;">
                <i class="fa-solid fa-calendar-check" style="font-size: 1.8rem; color: var(--accent-primary); -webkit-text-fill-color: var(--accent-primary);"></i> Booking Requests
            </h2>
            <button id="logoutBtn" class="btn-primary" style="padding: 10px 20px; background: transparent; border: 1px solid rgba(255,255,255,0.2);">Logout</button>
        </div>
        
        <div id="bookingControls" style="display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; background: rgba(25, 20, 35, 0.6); padding: 15px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
            <div class="form-group" style="flex: 1; min-width: 200px; margin: 0;">
                <input type="text" id="searchBookings" class="form-input" placeholder="Search name or email..." style="padding: 10px 15px; font-size: 0.9rem; margin-top: 0;">
            </div>
            <div class="form-group" style="width: auto; margin: 0;">
                <select id="filterCategory" class="form-input" style="padding: 10px 15px; font-size: 0.9rem; appearance: auto; margin-top: 0; background-color: rgba(10,8,19,0.8);">
                    <option value="">All Categories</option>
                    <option value="Wedding Photography">Wedding</option>
                    <option value="Pre-Wedding Shoot">Pre-Wedding</option>
                    <option value="Maternity Shoot">Maternity</option>
                    <option value="Event Photography">Event</option>
                    <option value="Commercial Shoot">Commercial</option>
                </select>
            </div>
            <div class="form-group" style="width: auto; margin: 0;">
                <select id="sortBookings" class="form-input" style="padding: 10px 15px; font-size: 0.9rem; appearance: auto; margin-top: 0; background-color: rgba(10,8,19,0.8);">
                    <option value="created_at">Newest First</option>
                    <option value="booking_date">By Event Date</option>
                </select>
            </div>
        </div>
        <div style="overflow-x: auto;">
            <table class="bookings-table">
                <thead>
                    <tr>
                        <th>Date Submitted</th>
                        <th>Customer</th>
                        <th>Phone</th>
                        <th>Service Category</th>
                        <th>Pref. Date</th>
                        <th>Time Slot</th>
                        <th>Requirements</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="bookingsBody">
                </tbody>
            </table>
        </div>
        
        <div id="paginationControls" style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; color: #aaa;">
            <div id="pageInfo" style="font-size: 0.9rem;">Showing 0 records</div>
            <div style="display: flex; gap: 10px;">
                <button id="prevPage" class="btn-primary" style="padding: 6px 15px; font-size: 0.9rem; background: rgba(25, 20, 35, 0.8); border: 1px solid rgba(255, 0, 127, 0.3); cursor: pointer;" disabled>Prev</button>
                <button id="nextPage" class="btn-primary" style="padding: 6px 15px; font-size: 0.9rem; background: rgba(25, 20, 35, 0.8); border: 1px solid rgba(255, 0, 127, 0.3); cursor: pointer;" disabled>Next</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('adminUsername').value;
            const pass = document.getElementById('adminPassword').value;
            if (user === 'AMF Studio' && pass === 'amf_123') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                document.getElementById('loginError').style.display = 'none';
                sessionStorage.setItem('admin_logged_in', 'true');
                loadBookings();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.removeItem('admin_logged_in');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('adminLoginForm').reset();
        });

        if (sessionStorage.getItem('admin_logged_in') === 'true') {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            loadBookings();
        }

        let adminState = {
            page: 1,
            limit: 20,
            search: '',
            category: '',
            sort: 'created_at',
            cache: {},
            isFetching: false,
            debounceTimer: null,
            totalCount: 0,
            totalPages: 1
        };

        const renderSkeleton = () => {
            const tbody = document.getElementById('bookingsBody');
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < 5; i++) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><div class="skeleton" style="width: 80px;"></div></td>
                    <td><div class="skeleton" style="width: 120px; margin-bottom:5px;"></div><div class="skeleton" style="width: 90px;"></div></td>
                    <td><div class="skeleton" style="width: 100px;"></div></td>
                    <td><div class="skeleton" style="width: 80px; height: 25px; border-radius: 4px;"></div></td>
                    <td><div class="skeleton" style="width: 90px;"></div></td>
                    <td><div class="skeleton" style="width: 70px;"></div></td>
                    <td><div class="skeleton" style="width: 150px;"></div></td>
                    <td><div class="skeleton" style="width: 32px; height: 32px; border-radius: 50%; margin: 0 auto;"></div></td>
                `;
                fragment.appendChild(tr);
            }
            tbody.innerHTML = '';
            tbody.appendChild(fragment);
        };

        async function loadBookings(forceRefresh = false) {
            if (adminState.isFetching) return;
            adminState.isFetching = true;
            
            const cacheKey = `${adminState.page}-${adminState.search}-${adminState.category}-${adminState.sort}`;
            
            if (!forceRefresh && adminState.cache[cacheKey]) {
                renderBookings(adminState.cache[cacheKey]);
                adminState.isFetching = false;
                return;
            }

            renderSkeleton();
            
            try {
                const params = new URLSearchParams({
                    page: adminState.page,
                    limit: adminState.limit,
                    search: adminState.search,
                    category: adminState.category,
                    sort: adminState.sort
                });
                const response = await fetch(`https://amk-studio-qbbn.onrender.com/api/bookings?${params.toString()}`);
                let result = await response.json();
                
                // Fallback for old API response (array)
                let bookings = [];
                if (Array.isArray(result)) {
                    // Client side filter/sort/pagination fallback
                    bookings = result.filter(b => {
                        const mSearch = !adminState.search || b.name.toLowerCase().includes(adminState.search.toLowerCase()) || b.email.toLowerCase().includes(adminState.search.toLowerCase());
                        const mCat = !adminState.category || b.category === adminState.category;
                        return mSearch && mCat;
                    });
                    bookings.sort((a,b) => {
                        if(adminState.sort === 'created_at') return new Date(b.created_at).getTime() - new Date(a.created_at).getTime();
                        return new Date(a.booking_date).getTime() - new Date(b.booking_date).getTime();
                    });
                    if (adminState.sort === 'created_at') bookings.reverse(); // Newest first
                    
                    adminState.totalCount = bookings.length;
                    adminState.totalPages = Math.ceil(adminState.totalCount / adminState.limit) || 1;
                    const offset = (adminState.page - 1) * adminState.limit;
                    bookings = bookings.slice(offset, offset + adminState.limit);
                } else {
                    bookings = result.data || [];
                    adminState.totalCount = result.totalCount || 0;
                    adminState.totalPages = result.totalPages || 1;
                }

                adminState.cache[cacheKey] = bookings;
                renderBookings(bookings);
            } catch (err) {
                console.error("Error loading bookings:", err);
                document.getElementById('bookingsBody').innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: #ff4d4d;">Failed to load data. Please try again.</td></tr>';
            } finally {
                adminState.isFetching = false;
            }
        }

        function renderBookings(bookings) {
            const tbody = document.getElementById('bookingsBody');
            const fragment = document.createDocumentFragment();
            
            if (bookings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: #888; font-size: 1.1rem;">No booking requests found.</td></tr>';
                updatePaginationUI();
                return;
            }

            bookings.forEach(b => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="white-space: nowrap; font-size: 0.9em; color: #aaa;">${new Date(b.created_at).toLocaleString()}</td>
                    <td><strong>${b.name}</strong><br><small style="color:#aaa;">${b.email}</small><br><small style="color:#888;">${b.location}</small></td>
                    <td style="white-space: nowrap;">${b.phone}</td>
                    <td><span style="background: rgba(255,0,127,0.1); padding: 4px 8px; border-radius: 4px; font-size: 0.9em; border: 1px solid rgba(255,0,127,0.2);">${b.category}</span></td>
                    <td style="white-space: nowrap;">${new Date(b.booking_date).toLocaleDateString()}</td>
                    <td>${b.slot}</td>
                    <td style="max-width: 250px; font-size: 0.9em; color: #ccc;">${b.details}</td>
                    <td style="text-align: center;">
                        <button onclick="deleteBooking(${b.id})" style="background: rgba(255, 77, 77, 0.1); border: 1px solid rgba(255, 77, 77, 0.3); color: #ff4d4d; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.3s;" onmouseover="this.style.background='rgba(255, 77, 77, 0.2)'" onmouseout="this.style.background='rgba(255, 77, 77, 0.1)'">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                fragment.appendChild(tr);
            });
            tbody.innerHTML = '';
            tbody.appendChild(fragment);
            updatePaginationUI();
        }

        function updatePaginationUI() {
            const pageInfo = document.getElementById('pageInfo');
            const prevBtn = document.getElementById('prevPage');
            const nextBtn = document.getElementById('nextPage');
            
            pageInfo.innerText = \`Showing page \${adminState.page} of \${adminState.totalPages} (\${adminState.totalCount} total)\`;
            prevBtn.disabled = adminState.page <= 1;
            nextBtn.disabled = adminState.page >= adminState.totalPages;
            
            prevBtn.style.opacity = prevBtn.disabled ? '0.5' : '1';
            nextBtn.style.opacity = nextBtn.disabled ? '0.5' : '1';
        }

        document.getElementById('prevPage')?.addEventListener('click', () => {
            if (adminState.page > 1) {
                adminState.page--;
                loadBookings();
            }
        });

        document.getElementById('nextPage')?.addEventListener('click', () => {
            if (adminState.page < adminState.totalPages) {
                adminState.page++;
                loadBookings();
            }
        });

        const handleFilterChange = () => {
            adminState.page = 1;
            adminState.cache = {}; // Invalidate cache on filter change
            loadBookings();
        };

        document.getElementById('searchBookings')?.addEventListener('input', (e) => {
            clearTimeout(adminState.debounceTimer);
            adminState.debounceTimer = setTimeout(() => {
                adminState.search = e.target.value.trim();
                handleFilterChange();
            }, 300);
        });

        document.getElementById('filterCategory')?.addEventListener('change', (e) => {
            adminState.category = e.target.value;
            handleFilterChange();
        });

        document.getElementById('sortBookings')?.addEventListener('change', (e) => {
            adminState.sort = e.target.value;
            handleFilterChange();
        });

        window.deleteBooking = async function(id) {
            if (confirm("Are you sure you want to delete this booking request?")) {
                try {
                    await fetch(\`https://amk-studio-qbbn.onrender.com/api/bookings/\${id}\`, { method: 'DELETE' });
                    adminState.cache = {}; // invalidate all cache
                    loadBookings(true);
                } catch (err) {
                    console.error("Error deleting booking:", err);
                }
            }
        }
    </script>

    <!-- Legal Modal Overlay -->
    <div id="legalModal" class="booking-success-modal" style="display: none; align-items: center; justify-content: center; z-index: 10008; padding: 20px;">
        <div class="modal-card" style="max-width: 650px; width: 100%; max-height: 80vh; overflow-y: auto; background: rgba(18, 14, 34, 0.98); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 20px; padding: 35px 30px; text-align: left; box-shadow: 0 20px 50px rgba(0,0,0,0.8);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;">
                <h3 id="legalModalTitle" style="color: var(--accent-primary); font-family: var(--font-heading); font-size: 1.5rem; margin: 0;">Privacy Policy</h3>
                <button onclick="closeLegalModal()" style="background: none; border: none; color: #FFF; font-size: 1.5rem; cursor: pointer;">&times;</button>
            </div>
            <div id="legalModalBody" style="color: rgba(255,255,255,0.85); font-size: 0.95rem; line-height: 1.6;"></div>
            <div style="text-align: right; margin-top: 25px;">
                <button onclick="closeLegalModal()" class="btn-primary" style="padding: 10px 24px; font-size: 0.9rem;">Close</button>
            </div>
        </div>
    </div>

    <script>
    window.openLegalModal = function(type) {
        var modal = document.getElementById('legalModal');
        var title = document.getElementById('legalModalTitle');
        var body = document.getElementById('legalModalBody');
        if (!modal || !title || !body) return;

        if (type === 'privacy') {
            title.innerText = "Privacy Policy";
            body.innerHTML = `
                <p><strong>AMF Studio Privacy Policy</strong></p>
                <p style="margin-top:10px;">At AMF Studio, we respect your privacy and are committed to protecting personal data collected through our website (amfstudio.in).</p>
                <h4 style="color:#D4AF37; margin-top:15px; margin-bottom:5px;">1. Information We Collect</h4>
                <p>When you book a session or contact us, we collect your name, email address, phone number, location, and session preferences.</p>
                <h4 style="color:#D4AF37; margin-top:15px; margin-bottom:5px;">2. How We Use Your Information</h4>
                <p>Your details are strictly used to schedule photography/videography sessions, respond to inquiries, send confirmation details, and improve our services.</p>
                <h4 style="color:#D4AF37; margin-top:15px; margin-bottom:5px;">3. Data Protection</h4>
                <p>We do not share, sell, or rent your personal information to third parties. All data stored in our PostgreSQL cloud database is protected with SSL encryption and parameterized queries.</p>
            `;
        } else if (type === 'terms') {
            title.innerText = "Terms & Conditions";
            body.innerHTML = `
                <p><strong>AMF Studio Terms & Conditions</strong></p>
                <p style="margin-top:10px;">Welcome to AMF Studio. By accessing our website or booking our services, you agree to comply with the following terms:</p>
                <h4 style="color:#D4AF37; margin-top:15px; margin-bottom:5px;">1. Booking & Scheduling</h4>
                <p>Shoot bookings require date and time slot confirmation through our portal. Please inform us at least 24 hours in advance if you need to reschedule.</p>
                <h4 style="color:#D4AF37; margin-top:15px; margin-bottom:5px;">2. Intellectual Property</h4>
                <p>All photographs, videography edits, and portfolio media displayed on this website remain the intellectual property of AMF Studio.</p>
                <h4 style="color:#D4AF37; margin-top:15px; margin-bottom:5px;">3. Contact & Support</h4>
                <p>For any queries or custom project requirements, reach out via our contact page or official phone number (+91 6379776173).</p>
            `;
        }
        modal.style.display = 'flex';
    };

    window.closeLegalModal = function() {
        var modal = document.getElementById('legalModal');
        if (modal) modal.style.display = 'none';
    };
    </script>

</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gradLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FF66"/>
    </linearGradient>
    <linearGradient id="gradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
  </defs>
  <g transform="translate(250, 250)">
    <!-- Top-Right Piece (Cyan to Green) -->
    <g transform="rotate(0)">
      <polygon points="-15,-180 40,-180 110,-60 55,-60" fill="#00E5FF" style="fill:url(#gradTop);"/>
      <polygon points="-35,-140 5,-140 60,-40 20,-40" fill="#00FF66" style="fill:url(#gradTop);"/>
    </g>
    <!-- Bottom-Right Piece (Green to Lime) -->
    <g transform="rotate(120)">
      <polygon points="-15,-180 40,-180 110,-60 55,-60" fill="#00C853" style="fill:url(#gradRight);"/>
      <polygon points="-35,-140 5,-140 60,-40 20,-40" fill="#84CC16" style="fill:url(#gradRight);"/>
    </g>
    <!-- Left Piece (Blue to Cyan) -->
    <g transform="rotate(240)">
      <polygon points="-15,-180 40,-180 110,-60 55,-60" fill="#0066FF" style="fill:url(#gradLeft);"/>
      <polygon points="-35,-140 5,-140 60,-40 20,-40" fill="#00E5FF" style="fill:url(#gradLeft);"/>
    </g>
  </g>
</svg>